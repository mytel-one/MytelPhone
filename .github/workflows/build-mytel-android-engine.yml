name: Build MyTel Android SIP engine

on:
  workflow_dispatch:
  push:
    branches: [build/android-sip-reply-v321]
    paths:
      - ".github/workflows/build-mytel-android-engine.yml"
      - "native-sdk/**"
      - "tools/check_android_sip_engine.py"

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, x86, x86_64]
    steps:
      - name: Check out the MyTel patch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends automake autoconf libtool libtool-bin \
            doxygen graphviz nasm yasm cpio gettext rsync python3-dev python3-setuptools \
            python3-pystache python3-six python3-jinja2 libssl-dev libsqlite3-dev libxml2-dev zlib1g-dev
      - name: Build and verify the native engine
        run: bash native-sdk/build-android-engine.sh "${{ matrix.abi }}"
      - name: Upload verified SDK component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mytel-sip-engine-${{ matrix.abi }}
          path: ${{ runner.temp }}/mytel-android-sdk-${{ matrix.abi }}/engine/
          if-no-files-found: error
          retention-days: 3
