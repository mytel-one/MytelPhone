name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Upload the debug APK for three days
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: MytelPhone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error
